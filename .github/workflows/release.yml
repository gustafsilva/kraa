name: Release

# Publica um GitHub Release com os binários de cada plataforma quando uma tag
# `v*` é empurrada. Os nomes dos assets são o contrato com o instalador npm
# (npm/src/platform.ts) e com scripts/install.sh / scripts/install.ps1 —
# mudar um nome aqui exige mudar lá também.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Mantido em sincronia com o ci.yml e com o go.mod.
  WAILS3_VERSION: v3.0.0-beta.26

jobs:
  check-version:
    name: Confere versão do npm/package.json x tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O instalador npm baixa o release `v<version do package.json>`, então
      # a tag e o package.json precisam bater.
      - name: Versão do package.json igual à tag
        run: |
          expected="v$(node -p "require('./npm/package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão de npm/package.json ($expected)."
            exit 1
          fi
          echo "Versão $expected confere com a tag."

  build-macos:
    name: Build macOS (universal)
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instala wails3 (versão fixada)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      # build/darwin/Taskfile.yml: `package:universal` builda arm64 + amd64,
      # junta com lipo e monta bin/prompt-improve.app (com codesign ad-hoc).
      - name: Empacota o .app universal
        run: wails3 task darwin:package:universal

      # O bundle é renomeado para "Prompt Improve.app" (o nome que os
      # instaladores usam em ~/Applications); renomear a pasta do bundle não
      # invalida a assinatura ad-hoc. `--keepParent` põe o .app na raiz do zip.
      - name: Compacta o .app
        run: |
          mv "bin/prompt-improve.app" "bin/Prompt Improve.app"
          lipo -info "bin/Prompt Improve.app/Contents/MacOS/prompt-improve"
          codesign --verify --deep --strict "bin/Prompt Improve.app"
          mkdir -p dist
          ditto -c -k --keepParent "bin/Prompt Improve.app" dist/prompt-improve-darwin-universal.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: asset-darwin-universal
          path: dist/prompt-improve-darwin-universal.app.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (amd64)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instala wails3 (versão fixada)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Build (wails3 build)
        run: wails3 build

      - name: Renomeia o executável
        shell: bash
        run: |
          mkdir -p dist
          cp bin/prompt-improve.exe dist/prompt-improve-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: asset-windows-amd64
          path: dist/prompt-improve-windows-amd64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    # R18: runners 22.04 (glibc mais antiga) para os binários rodarem no
    # Ubuntu 22.04 e 24.04.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Mesmas deps GTK3/WebKit2GTK 4.1 do ci.yml (R15: build com -tags gtk3,
      # aplicado automaticamente por build/linux/Taskfile.yml).
      - name: Instala dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instala wails3 (versão fixada)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Build (wails3 build)
        run: wails3 build

      - name: Renomeia o binário
        run: |
          mkdir -p dist
          cp bin/prompt-improve "dist/prompt-improve-linux-${{ matrix.arch }}"
          file "dist/prompt-improve-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-linux-${{ matrix.arch }}
          path: dist/prompt-improve-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publica o GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # Formato do `sha256sum` (`<hex>  <nome>`), lido por npm/src/install.ts,
      # scripts/install.sh e scripts/install.ps1.
      - name: Gera checksums.txt
        working-directory: dist
        run: |
          assets="prompt-improve-darwin-universal.app.zip prompt-improve-linux-amd64 prompt-improve-linux-arm64 prompt-improve-windows-amd64.exe"
          for f in $assets; do
            [ -f "$f" ] || { echo "::error::Asset ausente: $f"; exit 1; }
          done
          count="$(find . -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq 4 ] || { echo "::error::Esperava 4 assets, encontrei $count."; find . -maxdepth 1 -type f; exit 1; }
          # shellcheck disable=SC2086 # a lista é fixa e sem espaços
          sha256sum $assets > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
