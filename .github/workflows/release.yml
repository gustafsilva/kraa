name: Release

# Publica um GitHub Release com os binários de cada plataforma quando uma tag
# `v*` é empurrada e, depois, envia o pacote npm para o staging do npm. Os
# nomes dos assets são o contrato com o instalador npm (npm/src/platform.ts) e
# com scripts/install.sh / scripts/install.ps1 — mudar um nome aqui exige mudar
# lá também.
#
# Segurança (veja site/src/content/docs/contribuir/release.mdx):
# - actions fixadas por SHA completo (o Dependabot mantém atualizadas);
# - sem cache de dependências nos builds de release (evita cache poisoning);
# - o release nasce como rascunho e só é publicado com todos os assets, o que
#   funciona com "releases imutáveis" ligado no repositório;
# - o npm é publicado por trusted publishing (OIDC, sem token guardado) em modo
#   `npm stage publish`: a versão só vai ao ar depois que o mantenedor aprova
#   com 2FA no npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Mantido em sincronia com o ci.yml e com o go.mod.
  WAILS3_VERSION: v3.0.0-beta.26

jobs:
  check-version:
    name: Confere versão do npm/package.json x tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # O instalador npm baixa o release `v<version do package.json>`, então
      # a tag e o package.json precisam bater.
      - name: Versão do package.json igual à tag
        run: |
          expected="v$(node -p "require('./npm/package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão de npm/package.json ($expected)."
            exit 1
          fi
          echo "Versão $expected confere com a tag."

  build-macos:
    name: Build macOS (universal)
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Instala wails3 (versão fixada)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      # build/darwin/Taskfile.yml: `package:universal` builda arm64 + amd64,
      # junta com lipo e monta bin/kraa.app (com codesign ad-hoc).
      - name: Empacota o .app universal
        run: wails3 task darwin:package:universal

      # O bundle é renomeado para "Kraa.app" (o nome que os
      # instaladores usam em ~/Applications); renomear a pasta do bundle não
      # invalida a assinatura ad-hoc. `--keepParent` põe o .app na raiz do zip.
      # A troca só de maiúscula/minúscula passa por um nome temporário: no APFS
      # do runner (case-insensitive) `mv kraa.app Kraa.app` acharia que o destino
      # já existe e moveria o bundle para dentro de si mesmo.
      - name: Compacta o .app
        run: |
          mv "bin/kraa.app" "bin/kraa.app.tmp"
          mv "bin/kraa.app.tmp" "bin/Kraa.app"
          lipo -info "bin/Kraa.app/Contents/MacOS/kraa"
          codesign --verify --deep --strict "bin/Kraa.app"
          mkdir -p dist
          ditto -c -k --keepParent "bin/Kraa.app" dist/kraa-darwin-universal.app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asset-darwin-universal
          path: dist/kraa-darwin-universal.app.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (amd64)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Instala wails3 (versão fixada)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Build (wails3 build)
        run: wails3 build

      - name: Renomeia o executável
        shell: bash
        run: |
          mkdir -p dist
          cp bin/kraa.exe dist/kraa-windows-amd64.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asset-windows-amd64
          path: dist/kraa-windows-amd64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    # R18: runners 22.04 (glibc mais antiga) para os binários rodarem no
    # Ubuntu 22.04 e 24.04.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Mesmas deps GTK3/WebKit2GTK 4.1 do ci.yml (R15: build com -tags gtk3,
      # aplicado automaticamente por build/linux/Taskfile.yml).
      - name: Instala dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # A própria CLI importa `internal/operatingsystem`, que no Linux faz cgo
      # com GTK4/WebKitGTK 6.0 sem a tag — por isso `-tags gtk3` também aqui,
      # como no ci.yml (R15).
      - name: Instala wails3 (versão fixada)
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Build (wails3 build)
        run: wails3 build

      - name: Renomeia o binário
        run: |
          mkdir -p dist
          cp bin/kraa "dist/kraa-linux-${{ matrix.arch }}"
          file "dist/kraa-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asset-linux-${{ matrix.arch }}
          path: dist/kraa-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publica o GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # Formato do `sha256sum` (`<hex>  <nome>`), lido por npm/src/install.ts,
      # scripts/install.sh e scripts/install.ps1.
      - name: Gera checksums.txt
        working-directory: dist
        run: |
          assets="kraa-darwin-universal.app.zip kraa-linux-amd64 kraa-linux-arm64 kraa-windows-amd64.exe"
          for f in $assets; do
            [ -f "$f" ] || { echo "::error::Asset ausente: $f"; exit 1; }
          done
          count="$(find . -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq 4 ] || { echo "::error::Esperava 4 assets, encontrei $count."; find . -maxdepth 1 -type f; exit 1; }
          # shellcheck disable=SC2086 # a lista é fixa e sem espaços
          sha256sum $assets > checksums.txt
          cat checksums.txt

      # Rascunho primeiro: com "releases imutáveis" ligado, os assets precisam
      # estar anexados antes de o release ser publicado.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publica o rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Envia o pacote para o staging do npm por trusted publishing (OIDC). Nada
  # vai ao ar sem o mantenedor aprovar com 2FA (`npm stage approve` ou
  # npmjs.com). Roda só depois do GitHub Release publicado, porque o
  # instalador baixa o binário de lá.
  #
  # A variável NPM_TRUSTED_PUBLISHING (Settings → Secrets and variables →
  # Actions → Variables) liga este job depois que o trusted publisher estiver
  # configurado no npmjs.com; sem ela o job é pulado (ex.: na v0.1.0, publicada
  # à mão).
  publish-npm:
    name: Envia o pacote para o staging do npm
    needs: release
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    # O environment `npm` só aceita tags `v*`; o trusted publisher no npm
    # exige este workflow (release.yml) e este environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # `npm stage publish` exige npm >= 11.15.0; versão fixada.
      - name: Atualiza o npm
        run: npm install -g npm@11.20.0

      # --ignore-scripts: o `postinstall` do próprio pacote roda
      # `node dist/install.js`, que não deve baixar nada aqui.
      - name: Instala dependências
        run: npm ci --ignore-scripts

      - name: Testes
        run: npm test

      # O `prepack` compila o TypeScript. A provenance é gerada automaticamente
      # pelo trusted publishing. Pacote sem escopo: sempre público.
      - name: Envia para o staging
        run: npm stage publish
