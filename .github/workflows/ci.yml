name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Mantido em sincronia com o `go install` abaixo; veja CLAUDE.md para a
  # versão do Wails v3 usada no projeto (fixada no go.mod).
  WAILS3_VERSION: v3.0.0-beta.26

jobs:
  lint:
    name: Lint (gofmt + go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `go vet ./...` cgo-compila o pacote `application` do wails3 (ele
      # importa `github.com/wailsapp/wails/v3/pkg/application`, cujos
      # arquivos `*_linux.go`/`*_linux_gtk3.go` exigem cgo no Linux — não há
      # uma variante `!cgo` para desktop, só para `android` e para o modo
      # `server`, que este projeto não usa). Testei localmente
      # `GOOS=linux CGO_ENABLED=0 go vet ./...`: falha com "undefined:
      # pointer" em menu_linux.go/webview_window_linux.go, então essa rota
      # não funciona — por isso instalamos aqui as mesmas deps GTK3 do job
      # `build` e rodamos o vet com `-tags gtk3` (mesma tag usada no build,
      # ver ruling R15 e build/linux/Taskfile.yml).
      - name: Instala dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Os arquivos abaixo não estão formatados (rode 'gofmt -w .'):"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet -tags gtk3 ./...

      - name: go vet (server mode, E2E)
        run: CGO_ENABLED=0 go vet -tags server ./...

  build:
    name: Build e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # R15: este projeto builda Linux com `-tags gtk3` (GTK3 + WebKit2GTK
      # 4.1) em vez do padrão do wails3 v3.0.0-beta.26 (GTK4 + WebKitGTK
      # 6.0, pkg/application/linux_cgo.go — confirmado lendo o cache de
      # módulos: `#cgo linux pkg-config: gtk4 webkitgtk-6.0` sem a tag,
      # contra `gtk+-3.0 webkit2gtk-4.1 gdk-3.0` com `-tags gtk3`), porque
      # webkitgtk-6.0 não existe no Ubuntu 22.04. `-tags gtk3` já é o
      # default aplicado por build/linux/Taskfile.yml (ver
      # `LINUX_EXTRA_TAGS`), então basta instalar aqui os pacotes GTK3.
      - name: Instala dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # `wails3 build`/`wails3 task` embutem seu próprio runner do Task
      # internamente, então não é preciso instalar o binário `task`
      # separadamente (ex.: via arduino/setup-task) nesta pipeline.
      # A própria CLI importa `internal/operatingsystem`, que no Linux faz
      # cgo com GTK4/WebKitGTK 6.0 sem a tag — por isso `-tags gtk3` também
      # aqui (R15). A tag não afeta macOS nem Windows.
      - name: Instala wails3 (versão fixada)
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      # Gate de cobertura do backend (só no macOS: arquivos por SO mudam o
      # total entre plataformas). Mínimo em sincronia com a doc de testes.
      # O gate mede só `./internal/...`: no runner, `go test ./... -coverprofile`
      # conta a 0% os pacotes sem teste (`main`, `cmd/llmfake`) e até o pacote
      # Go que vem em `frontend/node_modules/flatted/golang` (dependência do
      # ESLint, instalada pelo `npm ci` acima), o que derrubou o total para
      # 73.8% no primeiro run. O pacote raiz e o `cmd/` continuam compilados e
      # testados no segundo comando.
      - name: Testes Go (com -race e cobertura, macOS)
        if: runner.os == 'macOS'
        run: |
          go test . ./cmd/... -race
          go test ./internal/... -race -coverprofile=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "Cobertura Go: ${total}%"
          awk -v t="$total" -v min=87 'BEGIN { if (t+0 < min) { print "Cobertura abaixo de " min "%"; exit 1 } }'

      # Linux precisa de `-tags gtk3` pelo mesmo motivo do build (ver
      # comentário acima sobre R15): o pacote `application` do wails3 exige
      # cgo com GTK3/WebKit2GTK 4.1 aqui, senão nem compila.
      - name: Testes Go (com -race, Linux)
        if: runner.os == 'Linux'
        run: go test ./... -race -tags gtk3

      # -race exige CGO_ENABLED=1 com um compilador C funcional. Os runners
      # windows-latest não garantem gcc/clang no PATH, e o código
      # específico do Windows (internal/platform/keys_windows.go) não usa
      # cgo (só o macOS usa, via ApplicationServices/CoreGraphics) — então,
      # em vez de depender de um toolchain C não garantido, rodamos os
      # testes sem -race apenas no Windows.
      - name: Testes Go (sem -race no Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Typecheck do frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Lint do frontend
        if: runner.os == 'Linux'
        run: npm run lint
        working-directory: frontend

      - name: Testes do frontend (com cobertura)
        run: npm run coverage
        working-directory: frontend

      - name: Build (wails3 build)
        run: wails3 build

      - name: Publica artifact
        uses: actions/upload-artifact@v4
        with:
          name: kraa-${{ matrix.os }}
          path: bin/
          if-no-files-found: error

  npm:
    name: Wrapper npm (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: npm/package-lock.json

      # --ignore-scripts: o `postinstall` do próprio pacote roda
      # `node dist/install.js`, que ainda não existe antes do build (e nem
      # deve baixar nada na CI).
      - name: Instala dependências
        run: npm ci --ignore-scripts

      - name: Testes (com cobertura)
        run: npm run coverage

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, server mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instala dependências do frontend
        run: npm ci
        working-directory: frontend

      # O //go:embed all:frontend/dist precisa do bundle real antes do build.
      - name: Build do frontend
        run: npm run build
        working-directory: frontend

      # -tags server exclui todos os arquivos GTK/WebKit do Wails: não precisa
      # de cgo nem de Xvfb (verificado com GOOS=linux CGO_ENABLED=0).
      - name: Build do binário E2E (server mode)
        run: CGO_ENABLED=0 go build -tags server -o bin/kraa-e2e .

      - name: Instala dependências do E2E
        run: npm ci
        working-directory: e2e

      # `npx tsc` a partir da raiz do repo não acha o TypeScript do e2e; o
      # binário local do próprio pacote sim.
      - name: Typecheck do E2E
        run: e2e/node_modules/.bin/tsc -p e2e --noEmit

      - name: Instala navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2e

      - name: Playwright
        run: npx playwright test
        working-directory: e2e

      - name: Publica relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
