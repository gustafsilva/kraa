# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "kraa"
arch: ${GOARCH}
platform: "linux"
version: "0.0.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Melhore prompts e mensagens com IA a partir de qualquer app"
vendor: "Matrix IA"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/kraa"
    dst: "/usr/local/bin/kraa"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/kraa.png"
  - src: "./build/linux/kraa.desktop"
    dst: "/usr/share/applications/kraa.desktop"

# Dependencies for the GTK3 + WebKit2GTK 4.1 stack. The app is built with
# `-tags gtk3` on Linux (see build/linux/Taskfile.yml, ruling R15): the
# default (non-gtk3) wails3 v3.0.0-beta.26 build needs GTK4 + WebKitGTK 6.0,
# which isn't packaged on Ubuntu 22.04, so this project targets GTK3
# everywhere on Linux instead. Keep this in sync with the apt/dnf/pacman
# packages installed in .github/workflows/ci.yml.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you migrate the build off `-tags gtk3` to the default GTK4 + WebKitGTK
# 6.0 stack (Ubuntu 24.04+ / Debian 13+; this is the stack `-tags gtk3` is
# removed in favor of starting with wails3 v3.1), replace the depends/
# overrides above with these:
#
# depends:
#   - libgtk-4-1
#   - libwebkitgtk-6.0-4
# overrides:
#   rpm:
#     depends:
#       - gtk4
#       - webkitgtk6.0
#   archlinux:
#     depends:
#       - gtk4
#       - webkitgtk-6.0
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
